<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#141812">
<meta name="description" content="Skal vi hjem? En overkonstruert og utelukkende humoristisk beslutningsmodell fra Kveldsdirektoratet.">
<title>Skal vi hjem? — Kveldsdirektoratet</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#141812;color:#f2f1e8;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:28px}main{max-width:560px}small{color:#bddb6f;letter-spacing:.14em;font-weight:700}h1{font-size:clamp(40px,8vw,68px);letter-spacing:-.05em;margin:20px 0}p{line-height:1.6;color:#c0c6b8}button{font:inherit;cursor:pointer;background:#c3e578;border:0;border-radius:9px;padding:12px 18px;color:#141812;font-weight:700}[hidden]{display:none!important}
</style>
</head>
<body>
<main id="loading"><small>KVELDSDIREKTORATET</small><h1>Skal vi hjem?</h1><p id="status" role="status">Beslutningsapparatet pakker ut papirene.</p><button id="retry" type="button" hidden onclick="location.reload()">Prøv igjen</button><noscript><p>Aktiver JavaScript i nettleseren for å bruke appen. Beregningene er bare humor.</p></noscript></main>
<script>window.__SVH='';</script>
<script src="./packed-1.js"></script>
<script src="./packed-2.js"></script>
<script src="./packed-3.js"></script>
<script src="./packed-4.js"></script>
<script>
(async function () {
  'use strict';
  try {
    if (!('DecompressionStream' in window)) {
      throw new Error('Åpne lenken i en oppdatert versjon av Edge, Chrome, Firefox eller Safari.');
    }
    if (typeof window.__SVH !== 'string' || window.__SVH.length !== 30368) {
      throw new Error('Alle appfilene ble ikke lastet. Last siden på nytt.');
    }
    const bytes = Uint8Array.from(atob(window.__SVH), function (c) { return c.charCodeAt(0); });
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html = await new Response(stream).text();
    if (!html.startsWith('<!DOCTYPE html>') || !html.includes('id="app-main"')) {
      throw new Error('Appfilen kunne ikke leses. Last siden på nytt.');
    }
    delete window.__SVH;
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    const status = document.getElementById('status');
    if (status) status.textContent = 'Appen kunne ikke åpnes. ' + (error.message || 'Prøv å laste siden på nytt.');
    const retry = document.getElementById('retry');
    if (retry) retry.hidden = false;
    console.error('Skal vi hjem: innlasting feilet.', error);
  }
})();
</script>
</body>
</html>
